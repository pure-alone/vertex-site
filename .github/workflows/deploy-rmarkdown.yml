name: Render and Deploy R Markdown site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          Rscript -e 'options(repos = "https://cloud.r-project.org");                              install.packages(c("rmarkdown","knitr"), dependencies=TRUE)'

      - name: Render site
        run: Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'

      - name: Commit and push docs/
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Render site: update docs/"
          file_pattern: "docs"
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
